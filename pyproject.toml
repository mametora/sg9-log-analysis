[project]
name = "sg9-log-analysis"
version = "0.1.0"
description = "Exploratory analysis of Subaru Forester SG9 RomRaider logs"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = "MIT"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.3.3,<3",
    "pandas>=2.3.3,<3",
    "scipy>=1.16.1,<2",
]

[dependency-groups]
dev = [
    "jupyter>=1.1.1,<2",
]
